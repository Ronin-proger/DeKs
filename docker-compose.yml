services:
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - OBSIDIAN_VAULT_PATH=/vault
      - OLLAMA_BASE_URL=http://ollama:11434
    volumes:
      - ./HAC:/vault:ro
      - ./server/users.db:/app/users.db
    depends_on:
      - ollama

  web:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - api

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  ollama_data:
